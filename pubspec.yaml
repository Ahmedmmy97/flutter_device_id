license: MIT
name: flutter_device_id
description: "Flutter plugin to get device id for Android and iOS"
version: 0.0.1
homepage:

environment:
  sdk: '>=3.4.0'
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  change_app_package_name: ^1.5.0

flutter:
  plugin:
    platforms:
      android:
        package: com.fdnsoft.flutter_device_id
        pluginClass: FlutterDeviceIdPlugin
      ios:
          pluginClass: FlutterDeviceIdPlugin

